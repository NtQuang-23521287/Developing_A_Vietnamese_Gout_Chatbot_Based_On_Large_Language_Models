# SFT v3.1 = SFT v3 train lại trên dữ liệu SFT v2.1 (data/sft_v2_1, dựng bằng scripts/fix_sft_v2_data.py):
#  - sửa các mẫu còn trái với góp ý bác sĩ vòng 1 (2 câu khuyên "không tự ý ngưng" khi colchicine gây tiêu chảy,
#    thiếu ngoại lệ phản ứng thuốc, ghi chú bác sĩ lọt vào câu hỏi, câu hỏi lao kê bị bỏ)
#  - nhãn nguồn RAG thật thay cho "doctor_review_excerpt_i" — giống hệt lúc suy luận
# Siêu tham số GIỮ NGUYÊN như sft_qwen3_8b_v3.yaml để so v3 với v3.1 chỉ khác ở dữ liệu.
# Dữ liệu: 150 mẫu bác sĩ đã xem ở vòng 1 (19 dòng có ghi chú, đã sửa theo ghi chú); không duyệt vòng 2.
# sft.py giữ checkpoint có val loss thấp nhất; chọn checkpoint cuối cùng theo REWARD TRÊN DEV (eval_adapter.py).
name: sft_qwen3_8b_v3_1
model_family: qwen3
base_model_config: configs/models/qwen3_8b.yaml
seed: 2026
train_data: data/sft_v2_1/train.jsonl
val_data: data/sft_v2_1/val.jsonl
output_dir: artifacts/runs/sft_qwen3_8b_v3_1
max_seq_length: 3072
long_example_policy: drop
min_fit_ratio: 0.90
medical_answers_approved: false
qlora:
  bits: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
trainer:
  learning_rate: 0.00005
  num_train_epochs: 10
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 10
  logging_steps: 5
  bf16: false   # T4 không hỗ trợ bf16
