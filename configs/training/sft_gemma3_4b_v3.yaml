# SFT v3 = huấn luyện trên DỮ LIỆU SFT v2 (RAG-aware, data/sft_v2). Thay cho sft_qwen3_8b_v2 (dữ liệu cũ).
# Khác biệt so với lần trước:
#  - dữ liệu có system prompt + NGỮ CẢNH RAG giống hệt lúc suy luận
#  - ít epoch hơn (dữ liệu sạch, tránh học thuộc); chọn checkpoint theo REWARD TRÊN DEV, không chỉ val loss
#  - max_seq_length 3072 vì mỗi mẫu có context (~1.000 token) và multi-turn có lịch sử
name: sft_gemma3_4b_v3
model_family: gemma3
base_model_config: configs/models/gemma3_4b.yaml
seed: 2026
train_data: data/sft_v2/train.jsonl
val_data: data/sft_v2/val.jsonl
output_dir: artifacts/runs/sft_gemma3_4b_v3
max_seq_length: 3072
long_example_policy: drop
min_fit_ratio: 0.90
medical_answers_approved: false
qlora:
  bits: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
trainer:
  learning_rate: 0.00005
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 10
  logging_steps: 5
  bf16: false   # T4 không hỗ trợ bf16
