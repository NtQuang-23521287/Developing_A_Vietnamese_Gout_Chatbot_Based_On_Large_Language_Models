# SFT v3 = huấn luyện trên DỮ LIỆU SFT v2 (RAG-aware, data/sft_v2). Thay cho sft_qwen3_8b_v2 (dữ liệu cũ).
# Khác biệt so với lần trước:
#  - dữ liệu có system prompt + NGỮ CẢNH RAG giống hệt lúc suy luận
#  - lần train 17/11 (adapter trong repo) dùng 10 epoch; sft.py giữ checkpoint có val loss THẤP NHẤT
#    (load_best_model_at_end, save_total_limit 2). Qwen: tốt nhất ở epoch 5; Gemma: ở epoch 10.
#    Kế hoạch ban đầu là 3 epoch; 10 epoch + lr Gemma 2e-5 trùng với điều kiện cứng của
#    scripts/evaluate_post_sft.py (viết cho SFT v1) — không đổi config cho vừa script đánh giá nữa.
#  - chọn checkpoint cuối cùng theo REWARD TRÊN DEV (eval_adapter.py), không chỉ val loss
#  - max_seq_length 3072 vì mỗi mẫu có context (~1.000 token) và multi-turn có lịch sử
name: sft_qwen3_8b_v3
model_family: qwen3
base_model_config: configs/models/qwen3_8b.yaml
seed: 2026
train_data: data/sft_v2/train.jsonl
val_data: data/sft_v2/val.jsonl
output_dir: artifacts/runs/sft_qwen3_8b_v3
max_seq_length: 3072
long_example_policy: drop
min_fit_ratio: 0.90
medical_answers_approved: false
qlora:
  bits: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
trainer:
  learning_rate: 0.00005
  num_train_epochs: 10
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 10
  logging_steps: 5
  bf16: false   # T4 không hỗ trợ bf16
